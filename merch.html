<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRD - Merch</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      /* Stili specifici per la pagina merch */
      .account-counter {
        font-size: 2.5rem;
        font-weight: bold;
        color: #28a745;
        margin-bottom: 1rem;
      }

      .skins-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }

      .skin-status {
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        text-align: left;
        max-width: 250px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body class="dark-mode">
    <nav class="navbar">
      <a href="index.html" class="logo-title">
        <img src="logo.png" alt="Logo Coral" class="logo-img" />
        <div class="title-text">
          PRD<br />
          <small>Partito Riformista Democratico</small>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="chi-siamo.html">Chi siamo</a></li>
        <li><a href="membri.html">Membri</a></li>
        <li><a href="contattaci.html">Contattaci</a></li>
        <li><a href="regolamento.html">Regolamento</a></li>
        <li><a href="merch.html">Merch</a></li>
        <li><button id="theme-toggle" class="theme-toggle">Toggle Tema</button></li>
      </ul>
    </nav>
    <section id="merch-content" class="section">
      <h1>Conto Corrente</h1>
      <div id="account-counter" class="account-counter">0</div>
      <button id="logout-btn" class="btn hidden">Logout</button>
      <section id="login-form" class="section">
        <h2>Accedi o Registrati</h2>
        <form id="login" class="form-container">
          <label for="username">Nome Utente</label>
          <input type="text" id="username" name="username" required>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
          <button type="submit" class="btn">Accedi</button>
          <button type="button" id="register-btn" class="btn">Registrati</button>
        </form>
      </section>
      <section id="skin-form" class="section hidden">
        <h2>Modulo per la tua Skin</h2>
        <form id="skin-submission" class="form-container">
          <label for="skin-name">Nome Utente</label>
          <input type="text" id="skin-name" name="skin-name" required>
          <label for="skin-desc">Descrivi la tua Skin</label>
          <textarea id="skin-desc" name="skin-desc" rows="4" placeholder="Descrivi la tua skin" required onfocus="this.placeholder=''"></textarea>
          <button type="submit" class="btn">Invia</button>
        </form>
      </section>
      <section id="purchase-history" class="section hidden">
        <h2>Skins Acquistate</h2>
        <div id="skins-gallery" class="skins-gallery">
        </div>
      </section>
    </section>
    <footer>
      &copy; 2025 Partito Riformista Democratico - Tutti i diritti riservati
    </footer>
    <script>
      const SUPABASE_URL = "https://wvcqvsmjlrtaoytedvts.supabase.co"; 
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2Y3F2c21qbHJ0YW95dGVkdnRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU3NjU2NDksImV4cCI6MjA3MTM0MTY0OX0.gz4N_eOpGSex2GYXSF8rvWJ6kzCjnM7jEJ4nYan4_A8";

      const { createClient } = supabase;
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const loginFormSection = document.getElementById('login-form');
      const skinFormSection = document.getElementById('skin-form');
      const logoutBtn = document.getElementById('logout-btn');
      const accountCounter = document.getElementById('account-counter');
      const skinDescInput = document.getElementById('skin-desc');
      const purchaseHistory = document.getElementById('purchase-history');

      let currentUsername = null;

      async function updateUI() {
          if (!currentUsername) return;
          
          const { data: userData, error: userError } = await supabaseClient
              .from('users')
              .select('balance')
              .eq('username', currentUsername)
              .single();

          if (userError) {
              console.error(userError);
              accountCounter.textContent = 'Errore';
          } else {
              accountCounter.textContent = userData.balance;
          }

          const { data: requestsData, error: requestsError } = await supabaseClient
              .from('skin_requests')
              .select('*')
              .eq('username', currentUsername);
          
          if (requestsError) {
              console.error(requestsError);
              return;
          }

          const gallery = document.getElementById('skins-gallery');
          gallery.innerHTML = '';
          requestsData.forEach(req => {
              const reqDiv = document.createElement('div');
              reqDiv.className = 'skin-status';
              reqDiv.innerHTML = `
                  <p>ID Richiesta: ${req.request_id}</p>
                  <p>Testo: ${req.request_text}</p>
                  <p>Stato: ${req.status}</p>
                  ${req.price ? `<p>Prezzo: ${req.price} Coral</p>` : ''}
              `;
              gallery.appendChild(reqDiv);
          });
      }

      async function handleAuth(isRegister, data) {
        const { username, password } = data;
        let result = {};
        if (isRegister) {
            const { data: existingUser } = await supabaseClient
                .from('users')
                .select('username')
                .eq('username', username);
            if (existingUser.length > 0) {
                alert("Nome utente già esistente.");
                return;
            }
            const { data: newUser, error } = await supabaseClient
                .from('users')
                .insert([{ username: username, password: password, balance: 0 }]);
            if (error) {
                result.message = 'Errore di registrazione: ' + error.message;
            } else {
                result.message = "Registrazione avvenuta con successo!";
                handleSuccess(username);
            }
        } else {
            const { data: user, error } = await supabaseClient
                .from('users')
                .select('password')
                .eq('username', username)
                .single();
            if (user && user.password === password) {
                result.message = "Accesso riuscito!";
                handleSuccess(username);
            } else {
                result.message = "Credenziali non valide.";
            }
        }
        alert(result.message);
      }

      function handleSuccess(username) {
        currentUsername = username;
        loginFormSection.classList.add('hidden');
        skinFormSection.classList.remove('hidden');
        purchaseHistory.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
        document.getElementById('skin-name').value = currentUsername;
        updateUI();
      }

      document.getElementById('login').addEventListener('submit', function(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        handleAuth(false, { username, password });
      });

      document.getElementById('register-btn').addEventListener('click', function() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        handleAuth(true, { username, password });
      });

      document.getElementById('skin-submission').addEventListener('submit', async function(event) {
        event.preventDefault();
        const username = document.getElementById('skin-name').value;
        const request_text = skinDescInput.value;
        
        const { data, error } = await supabaseClient
            .from('skin_requests')
            .insert([{ username: username, request_text: request_text }]);
        
        if (error) {
            alert('Errore nell\'invio della richiesta: ' + error.message);
        } else {
            alert("Richiesta inviata con successo!");
            skinDescInput.value = '';
            updateUI();
        }
      });

      document.getElementById('logout-btn').addEventListener('click', function() {
        currentUsername = null;
        loginFormSection.classList.remove('hidden');
        skinFormSection.classList.add('hidden');
        purchaseHistory.classList.add('hidden');
        logoutBtn.classList.add('hidden');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        accountCounter.textContent = '0';
        alert("Logout effettuato.");
      });
    </script>
  </body>
</html>
